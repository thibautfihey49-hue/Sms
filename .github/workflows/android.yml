name: Build Glass SMS APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix gradlew permission (if exists)
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi
          ls -la gradlew || echo "no gradlew - ok we build without it"

      - name: Setup Gradle 8.4 (NO WRAPPER NEEDED)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Build Debug APK with Gradle directly
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-SMS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Glass SMS v1.0 Build ${{ github.run_number }} - Glass Transparent
          body: |
            APK Debug Glass SMS - Ultra légère fluide aérée
            - Pavé numérique
            - SMS/MMS
            - Note vocale
            - Contacts + Historique
            - Style glass transparent arrondi
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle Wrapper
        run: |
          chmod +x gradlew build.sh
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      - name: Compiler APK
        run: ./build.sh release
      - uses: actions/upload-artifact@v4
        with: { name: Calculatrice-APK, path: app/build/outputs/apk/release/app-release-unsigned.apk }

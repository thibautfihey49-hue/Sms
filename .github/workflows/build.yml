name: Build APK Debug
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler APK Debug
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Préparer Gradle
        run: |
          chmod +x gradlew build.sh
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: Compiler APK Debug
        run: ./build.sh debug

      - name: Renommer l'APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Calculatrice-Debug.apk

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculatrice-Debug-APK
          path: Calculatrice-Debug.apk
